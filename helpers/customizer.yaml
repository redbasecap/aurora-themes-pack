# ═══════════════════════════════════════════════════════════════════════
#  AURORA THEMES PACK — LIVE CUSTOMIZER HELPERS
#  Paste the sections below into your configuration.yaml once.
#  After a restart, use the Lovelace card to change everything on the fly.
# ═══════════════════════════════════════════════════════════════════════
#
#  HOW IT WORKS
#  ────────────
#  Home Assistant `input_text` / `input_select` / `input_number` helpers
#  store your theme preferences. The "aurora-live" theme variant reads
#  those helpers via Jinja templates, so any change you make in the UI
#  repaints every dashboard instantly — no YAML edits, no restarts.
#
#  REQUIREMENTS
#  ────────────
#  ⚠️  Install `card-mod` from HACS → Frontend before using this customizer.
#  The Aurora Live theme uses card-mod to inject the animated @keyframes
#  CSS that drives the cinematic backgrounds. Without card-mod the colors
#  still apply but the background stays plain.
#
#  QUICK SETUP
#  ───────────
#  1. HACS → Frontend → search "card-mod" → Download → restart HA.
#  2. Open <config>/configuration.yaml
#  3. Paste the HELPERS section below (add to existing input_text /
#     input_select / input_number blocks, or create them if absent).
#  4. Restart Home Assistant.
#  5. Pick "Aurora Live" from your profile → Theme.
#  6. Drop the LOVELACE CARD (bottom of this file) into any dashboard view.
#
# ═══════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────
# HELPERS — paste into configuration.yaml
# ─────────────────────────────────────────────────────────────────────

input_text:
  theme_accent_aurora:
    name: "Aurora accent"
    icon: mdi:palette
    initial: "#7AA2FF"
    pattern: "^#[0-9A-Fa-f]{6}$"
    max: 7

  theme_accent_linen:
    name: "Linen accent"
    icon: mdi:palette
    initial: "#C2410C"
    pattern: "^#[0-9A-Fa-f]{6}$"
    max: 7

  theme_accent_obsidian:
    name: "Obsidian accent"
    icon: mdi:palette
    initial: "#00F5A0"
    pattern: "^#[0-9A-Fa-f]{6}$"
    max: 7

  theme_accent_secondary:
    name: "Secondary accent (cinematic)"
    icon: mdi:palette-swatch
    initial: "#B794F6"
    pattern: "^#[0-9A-Fa-f]{6}$"
    max: 7

  theme_accent_tertiary:
    name: "Tertiary accent (cinematic)"
    icon: mdi:palette-swatch
    initial: "#5EEAD4"
    pattern: "^#[0-9A-Fa-f]{6}$"
    max: 7

input_select:
  theme_background_style:
    name: "Background style"
    icon: mdi:image-filter-vintage
    options:
      - "off"
      - "orbs"
      - "aurora"
      - "mesh"
      - "cyber"
      - "cosmos"
      - "waves"
      - "dunes"
      - "bokeh"
    initial: "aurora"

  theme_corner_radius:
    name: "Corner radius"
    icon: mdi:rounded-corner
    options:
      - "sharp"    # 4 px  — Obsidian-style crisp
      - "soft"     # 14 px — balanced default
      - "pillow"   # 24 px — Aurora-style pillowy
    initial: "soft"

  theme_gloss:
    name: "Card gloss"
    icon: mdi:water
    options:
      - "none"
      - "soft"
      - "medium"
      - "high"
    initial: "medium"

input_number:
  theme_glow_intensity:
    name: "Glow intensity"
    icon: mdi:weather-sunny
    min: 0
    max: 100
    step: 5
    initial: 60
    unit_of_measurement: "%"

  theme_background_opacity:
    name: "Background intensity"
    icon: mdi:opacity
    min: 0
    max: 100
    step: 5
    initial: 65
    unit_of_measurement: "%"

# ─────────────────────────────────────────────────────────────────────
